services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      INCIDENTLAB_FIXTURES: /app/fixtures/incidents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: ["/tmp"]
