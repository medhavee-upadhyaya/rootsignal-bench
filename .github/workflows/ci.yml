name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v
      - run: python -m evals.run --fixtures fixtures/incidents --minimum 0.80
      - run: python -m evals.retrieval --fixtures fixtures/incidents --k 2 --ablation --minimum-recall 1.0
      - run: python -m evals.adversarial --minimum 1.0
      - run: python -m training.build_dataset --fixtures fixtures/incidents --output /tmp/tool_calls.jsonl
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --prefix web
      - run: npm --prefix web run lint
      - run: npm --prefix web test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: rootsignal:ci}
