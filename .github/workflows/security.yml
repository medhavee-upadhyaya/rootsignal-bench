name: Security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --prefix web
      - name: Block high-severity runtime vulnerabilities
        run: npm audit --prefix web --omit=dev --audit-level=high
      - name: Block critical vulnerabilities in the full dependency graph
        run: npm audit --prefix web --audit-level=critical
