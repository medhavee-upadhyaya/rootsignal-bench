apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootsignal
spec:
  replicas: 2
  selector:
    matchLabels: {app: rootsignal}
  template:
    metadata:
      labels: {app: rootsignal}
    spec:
      containers:
        - name: api
          image: ghcr.io/medhavee-upadhyaya/rootsignal-bench:latest
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: rootsignal
spec:
  selector: {app: rootsignal}
  ports: [{port: 80, targetPort: 8000}]
